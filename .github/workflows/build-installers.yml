name: Build Deskling installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            arch: x64
            runner: windows-latest
            script: dist:win
          - platform: mac
            arch: arm64
            runner: macos-latest
            script: dist:mac
          - platform: mac
            arch: x64
            runner: macos-15-intel
            script: dist:mac
          - platform: linux
            arch: x64
            runner: ubuntu-22.04
            script: dist:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release tag
        shell: bash
        run: |
          node -e 'if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) throw new Error("Tag must match package.json version")'
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 libfuse2
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build installation files
        run: npm run ${{ matrix.script }}
      - name: Check packaged app (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run smoke:packaged
      - name: Check packaged app (Linux X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:packaged
      - name: Check Windows installer and reinstall
        if: runner.os == 'Windows'
        run: npm run smoke:installer
      - name: Check real update download and integrity
        if: runner.os == 'Windows'
        run: npm run test:updates:download
      - name: Check version upgrade and preserved data
        if: runner.os == 'Windows'
        run: npm run test:updates:install
      - name: Upload installation files
        uses: actions/upload-artifact@v4
        with:
          name: Deskling-${{ matrix.platform }}-${{ matrix.arch }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.tar.gz
            dist/SHA256SUMS-*.txt
