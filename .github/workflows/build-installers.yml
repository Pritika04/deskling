name: Build Deskling installers

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the release after all native checks pass
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            arch: x64
            runner: windows-latest
            script: dist:win
          - platform: mac
            arch: arm64
            runner: macos-latest
            script: dist:mac
          - platform: mac
            arch: x64
            runner: macos-15-intel
            script: dist:mac
          - platform: linux
            arch: x64
            runner: ubuntu-22.04
            script: dist:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release tag
        shell: bash
        run: |
          node -e 'if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) throw new Error("Tag must match package.json version")'
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2 libfuse2
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build installation files
        run: npm run ${{ matrix.script }}
      - name: Check packaged app (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run smoke:packaged
      - name: Check packaged app (Linux X11)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:packaged
      - name: Check Windows installer and reinstall
        if: runner.os == 'Windows'
        run: npm run smoke:installer
      - name: Check real update download and integrity
        if: runner.os == 'Windows'
        run: npm run test:updates:download
      - name: Check version upgrade and preserved data
        if: runner.os == 'Windows'
        run: npm run test:updates:install
      - name: Upload installation files
        uses: actions/upload-artifact@v4
        with:
          name: Deskling-${{ matrix.platform }}-${{ matrix.arch }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.tar.gz
            dist/SHA256SUMS-*.txt

  publish:
    name: Publish verified release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify release files
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const {version}=require('./package.json');
          if(!/^\d+\.\d+\.\d+$/.test(version))throw Error('A stable release version is required');
          const base=`Deskling-${version}-`;
          const installers=new Set(['win-x64.exe','mac-arm64.dmg','mac-arm64.zip','mac-x64.dmg','mac-x64.zip','linux-x86_64.AppImage','linux-x64.tar.gz'].map(s=>base+s));
          const manifests=new Set(['win-x64','mac-arm64','mac-x64','linux-x64'].map(s=>`SHA256SUMS-${s}.txt`));
          const allowed=new Set([...installers,...manifests,`${base}win-x64.exe.blockmap`,'latest.yml']);
          const files=[];function walk(dir){for(const name of fs.readdirSync(dir)){const p=path.join(dir,name);if(fs.statSync(p).isDirectory())walk(p);else files.push(p)}}walk('artifacts');
          const checked=new Set();
          for(const m of files.filter(p=>manifests.has(path.basename(p))))for(const line of fs.readFileSync(m,'utf8').trim().split(/\r?\n/)){
            const [hash,name]=line.split(/  /);
            if(!installers.has(name)||checked.has(name))throw Error('Unexpected or duplicate installer: '+name);
            if(crypto.createHash('sha256').update(fs.readFileSync(path.join(path.dirname(m),name))).digest('hex')!==hash)throw Error('Checksum mismatch: '+name);
            checked.add(name);
          }
          const assets=files.filter(p=>allowed.has(path.basename(p)));
          if(checked.size!==7||assets.length!==13||new Set(assets.map(p=>path.basename(p))).size!==13)throw Error('Incomplete release assets');
          fs.writeFileSync('release-assets.txt',assets.join('\n')+'\n');
          console.log('Verified all seven installers and thirteen release assets');
          NODE
      - name: Upload and publish
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          if gh release view "$tag" --json isDraft --jq .isDraft > release-draft.txt; then
            test "$(cat release-draft.txt)" = true
          else
            gh release create "$tag" --target "$RELEASE_COMMIT" --draft --title "Deskling $version" --notes-file .github/release-notes.md
          fi
          mapfile -t files < release-assets.txt
          gh release upload "$tag" "${files[@]}" --clobber
          gh release edit "$tag" --draft=false --latest
