<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self'; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deskling</title>
  <link rel="stylesheet" href="avatar.css">
  <script defer src="domain.js"></script>
  <script defer src="theme.js"></script>
  <script defer src="wardrobe.js"></script>
  <script defer src="avatar.js"></script>
</head>
<body>
  <button id="buddy" aria-label="Open or close Deskling. Drag to move." title="Click for your day · drag to move">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <ellipse id="buddy-shadow" cx="50" cy="91" rx="29" ry="4" fill="#263f31" opacity=".12"/>
      <g id="idle-motion"><g id="character"></g></g>
      <g id="egg"><path d="M22 63C22 40 35 15 50 15S78 40 78 63Q78 87 50 87T22 63Z" fill="#f3e6c8" stroke="#b6a27a" stroke-width="2"/><path d="m36 41 4 2m23 17 3-2M37 70l3 1" stroke="#dbc89e" stroke-width="5" stroke-linecap="round"/><path class="egg-crack" d="m53 17-7 17 10 6-12 16 8 7-7 22" fill="none" stroke="#b6a27a" stroke-width="2"/><path d="M39 56v3m22-3v3m-16 8q5 4 10 0" fill="none" stroke="#716345" stroke-width="2.5" stroke-linecap="round"/></g>
      <g class="affection-hearts" fill="#cb8b99"><path d="M13 33C1 25 7 16 13 23c6-7 12 2 0 10Z"/><path d="M86 22c-10-7-5-14 0-8 5-6 10 1 0 8Z"/></g>
      <g class="sleep-marks" fill="#70896a" font-size="12" font-family="sans-serif"><text x="76" y="26">z</text><text x="85" y="16" font-size="9">z</text></g>
      <g id="gift" stroke-width="2" stroke-linejoin="round">
        <ellipse class="gift-halo" cx="52" cy="60" rx="40" ry="37" stroke="none"/>
        <path class="gift-spark" d="m15 27 2-6 2 6 6 2-6 2-2 6-2-6-6-2Zm69 33 2-5 2 5 5 2-5 2-2 5-2-5-5-2Z" stroke="none"/>
        <path d="M28 43H76V81Q76 87 70 87H34Q28 87 28 81Z" class="gift-paper"/>
        <path d="M23 35H81V49H23Z" class="gift-paper"/>
        <path d="M47 35H57V87H47Z" class="gift-ribbon" stroke="none"/>
        <path d="M51 35C22 37 28 10 44 22L52 34C78 37 78 11 62 22L52 34" fill="none" class="gift-bow" stroke-width="5" stroke-linecap="round"/>
        <path d="M37 60V64M67 60V64M46 72Q52 78 58 72" fill="none" stroke="#3e5146" stroke-linecap="round"/>
      </g>
      <g class="confetti" stroke-width="3" stroke-linecap="round"><path d="M12 23L16 28" stroke="#c58c70"/><path d="M85 23L81 28" stroke="#9582b4"/><path d="M8 50L13 49" stroke="#c5aa70"/><path d="M88 49L93 50" stroke="#789568"/><path d="M29 10L31 16" stroke="#67989f"/><path d="M70 10L68 16" stroke="#c58c70"/></g>
    </svg>
  </button>
  <div class="resize-edge top" data-edge="top" role="slider" tabindex="0" aria-label="Buddy size. Drag up or down, or use arrow keys. Double-click to reset." aria-valuemin="64" aria-valuemax="160" aria-valuenow="68" title="Drag up or down to resize · double-click for default size"></div>
  <div class="resize-edge bottom" data-edge="bottom" role="slider" tabindex="0" aria-label="Buddy size. Drag up or down, or use arrow keys. Double-click to reset." aria-valuemin="64" aria-valuemax="160" aria-valuenow="68" title="Drag up or down to resize · double-click for default size"></div>
</body>
</html>
